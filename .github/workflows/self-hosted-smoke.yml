name: Self-hosted runner smoke test

on:
  push:
    branches:
      - main

jobs:
  smoke-test:
    runs-on:
      - self-hosted
      - linux
      - x64
      - replicant-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show runner environment
        run: |
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $PWD"
          uname -a

      - name: Check Docker
        run: |
          docker version

      - name: Test Rust container
        run: |
          docker run --rm rust:1.94 bash -c '
            rustc --version
            cargo --version
          '
