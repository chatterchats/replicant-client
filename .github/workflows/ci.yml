name: Replicant Client CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: replicant-ci-${{ github.ref }}
  # Every replacement run compares HEAD to the last successful validation
  # baseline, so cancelling an in-flight older run cannot lose coverage.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /home/chats/.cache/replicant-ci/target
  CARGO_TARGET_MAX_GIB: 75
  PIP_CACHE_DIR: /home/chats/.cache/replicant-ci/pip
  npm_config_cache: /home/chats/.cache/replicant-ci/npm

jobs:
  ci:
    name: Selective CI
    runs-on:
      - self-hosted
      - linux
      - x64
      - replicant-ci
    timeout-minutes: 180

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add user tools to PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Classify changed paths
        id: classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_WORKFLOW: ci.yml
          CI_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/ci_changed.py --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_changed.py \
              --last-successful \
              --repository "$CI_REPOSITORY" \
              --workflow "$CI_WORKFLOW" \
              --branch "$CI_BRANCH" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Run selected CI domains
        shell: bash
        env:
          CORE: ${{ steps.classify.outputs.core }}
          POLICY: ${{ steps.classify.outputs.policy }}
          GALAXY: ${{ steps.classify.outputs.galaxy }}
          WEB: ${{ steps.classify.outputs.web }}
          DESKTOP: ${{ steps.classify.outputs.desktop }}
          DOCS: ${{ steps.classify.outputs.docs }}
          DOCKER: ${{ steps.classify.outputs.docker }}
        run: |
          targets=()

          [[ "$CORE" == "true" ]] && targets+=(ci-core)
          [[ "$POLICY" == "true" ]] && targets+=(ci-policy)
          [[ "$GALAXY" == "true" ]] && targets+=(ci-galaxy)
          [[ "$WEB" == "true" ]] && targets+=(ci-web)
          [[ "$DESKTOP" == "true" ]] && targets+=(ci-desktop)
          [[ "$DOCS" == "true" ]] && targets+=(ci-docs)
          [[ "$DOCKER" == "true" ]] && targets+=(compose-check)

          if ((${#targets[@]} == 0)); then
            echo "No build domains affected."
          else
            printf 'Selected Make targets: %s\n' "${targets[*]}"
            make -k "${targets[@]}"
          fi

      - name: Cache maintenance and disk usage
        if: always()
        shell: bash
        run: |
          if [[ -d "$CARGO_TARGET_DIR" ]]; then
            target_kib=$(du -sk "$CARGO_TARGET_DIR" | awk '{print $1}')
            threshold_kib=$(( ${{ env.CARGO_TARGET_MAX_GIB }} * 1024 * 1024 ))

            target_gib=$(awk -v kib="$target_kib" \
              'BEGIN { printf "%.1f", kib / 1024 / 1024 }')

            echo "Cargo target cache: ${target_gib} GiB"

            if (( target_kib >= threshold_kib )); then
              echo "Cargo target cache is >= 75 GiB; cleaning it."
              cargo clean --target-dir "$CARGO_TARGET_DIR"

              echo "Cargo target cache after cleanup:"
              du -sh "$CARGO_TARGET_DIR" 2>/dev/null || true
            else
              echo "Cargo target cache is below 75 GiB; retaining it."
            fi
          else
            echo "Cargo target cache does not exist."
          fi

          du -sh "$HOME/.cargo/registry" 2>/dev/null || true
          df -h .
