services:
  replicantd:
    image: replicant/replicantd:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Bound to the compose network, not the host: the web container reaches
      # it by service name and only its own port is published.
      REPLICANTD_BIND: 0.0.0.0:8080
      # Required for any non-loopback bind. `make token` writes one into .env.
      REPLICANTD_TOKEN: ${REPLICANTD_TOKEN:?set REPLICANTD_TOKEN; the daemon can start workflows and run actions}
      REPLICANT_DB: /var/lib/replicant/replicant-client.sqlite
      REPLICANT_RUNTIME_DB: /var/lib/replicant/replicant-runtime.sqlite
      REPLICANT_PROFILE: ${REPLICANT_PROFILE:-default}
      RS_API_TOKEN: ${RS_API_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
    user: "${REPLICANT_UID:-1000}:${REPLICANT_GID:-1000}"
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${REPLICANT_DATA_DIR:-${HOME}/.local/share/replicant}
        target: /var/lib/replicant
        bind:
          create_host_path: false
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    image: replicant/web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # nginx adds this to proxied /api/ and /ws requests, so the secret stays
      # server-side instead of being shipped in the JS bundle. Rotating it is a
      # `docker compose up -d web` away; no rebuild.
      REPLICANTD_TOKEN: ${REPLICANTD_TOKEN:?set REPLICANTD_TOKEN; run `make token`}
      # Restricts the entrypoint's template rendering to this prefix so nginx's
      # own $variables are left untouched.
      NGINX_ENVSUBST_FILTER: "^REPLICANTD_"
    depends_on:
      replicantd:
        condition: service_healthy
    ports:
      - "${REPLICANT_WEB_PORT:-8080}:8080"
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

networks:
  app:
    driver: bridge
