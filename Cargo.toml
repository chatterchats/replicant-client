[workspace]
members = [
  ".",
  "crates/replicant-route-planner",
  "crates/replicant-event-planner",
  "crates/replicant-mining-planner",
  "crates/replicant-bootstrap-planner",
  "crates/replicant-printing",
  "crates/replicant-transport",
  "crates/replicant-runtime",
  "crates/replicant-protocol",
  "crates/replicant-server",
  "crates/replicant-workflow",
  "crates/replicant-cli",
  "apps/desktop/src-tauri",
]
resolver = "3"

[package]
name = "replicant-client"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
authors = ["Replicant Space contributors"]
description = "A durable, stateful Rust client for building Replicant Space applications."
license = "MIT"
keywords = ["replicant-space", "client", "api", "sse"]
categories = ["api-bindings", "asynchronous"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/README.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/src/**",
  "/migrations/**",
  "/examples/**",
  "/tests/**",
]

[package.metadata.replicant-space]
version = "2.5.2"
documentation-version = "2.5.2"
documentation-manifest-sha256 = "9444e118020ef8e80271b3bf8fec35e2c657d4df3e773ce8b6e0444ecacad50c"
openapi-version = "2.5.2"
openapi-sha256 = "df5f74046e95678f54161b930af6d8b1abbe4b07b1718e485b5a4d46f6757639"

[lib]
name = "replicant_client"
path = "src/lib.rs"

[features]
default = ["managed", "rustls-tls"]

# Typed raw HTTP transport, authentication, models, pagination, and
# rate-limit metadata for the current (non-deprecated, non-admin) contract.
raw = [
  "dep:futures",
  "dep:httpdate",
  "dep:reqwest",
  "dep:secrecy",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
  "dep:uuid",
]

# Raw SSE parsing and event streaming on top of `raw`.
events = ["raw", "dep:eventsource-stream", "dep:tokio-stream", "reqwest/stream"]

# SQLite-backed durable state, synchronization, durable operations, and the
# managed `Client`, on top of `events`.
managed = ["events", "dep:rusqlite", "dep:sha2", "shared-rate-limit"]

# Cross-process SQLite rate-limit coordination. Enabled by managed clients by default,
# and available to raw-only users explicitly without forcing managed state.
shared-rate-limit = ["dep:rusqlite"]

# reqwest rustls TLS backend.
rustls-tls = ["reqwest?/rustls", "reqwest?/rustls-native-certs"]

# reqwest native-tls TLS backend.
native-tls = ["reqwest?/native-tls"]

[dependencies]
eventsource-stream = { version = "0.2", optional = true }
futures = { version = "0.3", optional = true }
httpdate = { version = "1.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
secrecy = { version = "0.10", features = ["serde"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }

[dev-dependencies]
replicant-runtime = { path = "crates/replicant-runtime" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

[[example]]
name = "raw_read"
required-features = ["raw"]

[[example]]
name = "raw_events"
required-features = ["events"]

[[example]]
name = "managed_sync"
required-features = ["managed"]

[[example]]
name = "fluent_queries"
required-features = ["managed"]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[[example]]
name = "bobnet_messages"
required-features = ["managed"]

[[example]]
name = "game_concepts"
required-features = ["managed"]

[[example]]
name = "initialize_colony_database"
required-features = ["managed"]

[[example]]
name = "nearby_belt_report"
required-features = ["managed"]

[[example]]
name = "tag_twaffy_ring_injectors"
required-features = ["managed"]
