[workspace]
members = [
  ".",
  "crates/replicant-route-planner",
  "crates/replicant-event-planner",
  "crates/replicant-event-cli",
  "crates/replicant-mining-planner",
  "crates/replicant-mining-cli",
  "crates/replicant-bootstrap-planner",
  "crates/replicant-bootstrap-cli",
  "crates/replicant-printing",
  "crates/replicant-printing-cli",
  "crates/replicant-transport",
  "crates/replicant-transport-cli",
  "crates/replicant-relay-cli",
  "crates/replicant-survey-cli",
  "crates/replicant-rikers-cli",
]
resolver = "3"

[package]
name = "replicant-client"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
authors = ["Replicant Space contributors"]
description = "A durable, stateful Rust client for building Replicant Space applications."
license = "MIT"
keywords = ["replicant-space", "client", "api", "sse"]
categories = ["api-bindings", "asynchronous"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/README.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/src/**",
  "/migrations/**",
  "/examples/**",
  "/tests/**",
]

[package.metadata.replicant-space]
version = "2.4.0"
documentation-version = "2.4.0"
documentation-manifest-sha256 = "54d5b394a5eb9f0ba54afb9eb1aae9bbad4d55a634a4299c1e7ab6c97c601f15"
openapi-version = "2.4.0"
openapi-sha256 = "9f5498b2229e9aea6c20840b61267b09a0fffcc7ac87804b6c80db98fc058e31"

[lib]
name = "replicant_client"
path = "src/lib.rs"

[features]
default = ["managed", "rustls-tls"]

# Typed raw HTTP transport, authentication, models, pagination, and
# rate-limit metadata for the current (non-deprecated, non-admin) contract.
raw = [
  "dep:futures",
  "dep:httpdate",
  "dep:reqwest",
  "dep:secrecy",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
  "dep:uuid",
]

# Raw SSE parsing and event streaming on top of `raw`.
events = ["raw", "dep:eventsource-stream", "dep:tokio-stream", "reqwest/stream"]

# SQLite-backed durable state, synchronization, durable operations, and the
# managed `Client`, on top of `events`.
managed = ["events", "dep:rusqlite"]

# reqwest rustls TLS backend.
rustls-tls = ["reqwest?/rustls", "reqwest?/rustls-native-certs"]

# reqwest native-tls TLS backend.
native-tls = ["reqwest?/native-tls"]

[dependencies]
eventsource-stream = { version = "0.2", optional = true }
futures = { version = "0.3", optional = true }
httpdate = { version = "1.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
secrecy = { version = "0.10", features = ["serde"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

[[example]]
name = "raw_read"
required-features = ["raw"]

[[example]]
name = "raw_events"
required-features = ["events"]

[[example]]
name = "managed_sync"
required-features = ["managed"]

[[example]]
name = "fluent_queries"
required-features = ["managed"]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }

[[example]]
name = "bobnet_messages"
required-features = ["managed"]

[[example]]
name = "game_concepts"
required-features = ["managed"]

[[example]]
name = "initialize_colony_database"
required-features = ["managed"]

[[example]]
name = "nearby_belt_report"
required-features = ["managed"]

[[example]]
name = "tag_twaffy_ring_injectors"
required-features = ["managed"]
