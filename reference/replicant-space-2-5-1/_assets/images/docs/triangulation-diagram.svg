<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <radialGradient id="sol-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a735" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8a735" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d45c8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d45c8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone-fill" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#c47a3a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c47a3a" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cone-stroke-grad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#c47a3a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c47a3a" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="320" rx="6" fill="#0b1120"/>

  <!-- perspective grid - floor plane -->
  <g stroke="#1a2538" stroke-width="0.5" opacity="0.6">
    <line x1="60" y1="320" x2="780" y2="320"/>
    <line x1="100" y1="290" x2="760" y2="290"/>
    <line x1="140" y1="260" x2="740" y2="260"/>
    <line x1="180" y1="230" x2="720" y2="230"/>
    <line x1="220" y1="200" x2="700" y2="200"/>
    <line x1="140" y1="320" x2="260" y2="200"/>
    <line x1="260" y1="320" x2="340" y2="200"/>
    <line x1="380" y1="320" x2="420" y2="200"/>
    <line x1="500" y1="320" x2="500" y2="200"/>
    <line x1="620" y1="320" x2="580" y2="200"/>
    <line x1="740" y1="320" x2="660" y2="200"/>
  </g>

  <!-- scattered stars -->
  <g fill="#3a4565" opacity="0.7">
    <circle cx="95" cy="72" r="1"/>
    <circle cx="210" cy="45" r="0.8"/>
    <circle cx="340" cy="88" r="1.2"/>
    <circle cx="580" cy="65" r="1"/>
    <circle cx="690" cy="42" r="0.9"/>
    <circle cx="760" cy="95" r="0.8"/>
    <circle cx="150" cy="130" r="0.6"/>
    <circle cx="620" cy="120" r="0.7"/>
    <circle cx="50" cy="200" r="0.8"/>
    <circle cx="790" cy="180" r="0.6"/>
    <circle cx="300" cy="340" r="0.7"/>
    <circle cx="550" cy="350" r="0.9"/>
    <circle cx="720" cy="330" r="0.6"/>
    <circle cx="180" cy="48" r="1.1"/>
    <circle cx="750" cy="150" r="0.7"/>
  </g>

  <!-- aim line: SOL to target (dashed) -->
  <line x1="138" y1="255" x2="412" y2="218" stroke="#4fc3c9" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- direction cone from target upward to signal source -->
  <polygon points="420,215 480,60 400,50" fill="url(#cone-fill)"/>
  <line x1="420" y1="215" x2="480" y2="60" stroke="url(#cone-stroke-grad)" stroke-width="1"/>
  <line x1="420" y1="215" x2="400" y2="50" stroke="url(#cone-stroke-grad)" stroke-width="1"/>
  <!-- cone centre line (the direction vector) -->
  <line x1="420" y1="215" x2="440" y2="55" stroke="#c47a3a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- SOL glow -->
  <circle cx="130" cy="257" r="40" fill="url(#sol-glow)"/>
  <!-- SOL dot -->
  <circle cx="130" cy="257" r="4" fill="#e8a735"/>
  <circle cx="130" cy="257" r="2" fill="#f5d890"/>

  <!-- target crosshair -->
  <g stroke="#4fc3c9" stroke-width="1" opacity="0.8">
    <line x1="420" y1="205" x2="420" y2="225"/>
    <line x1="410" y1="215" x2="430" y2="215"/>
    <circle cx="420" cy="215" r="6" fill="none"/>
  </g>
  <circle cx="420" cy="215" r="2" fill="#4fc3c9"/>

  <!-- signal source glow -->
  <circle cx="440" cy="55" r="30" fill="url(#signal-glow)"/>
  <!-- signal source dot -->
  <circle cx="440" cy="55" r="3.5" fill="#d45c8a"/>
  <circle cx="440" cy="55" r="1.5" fill="#f0a0c0"/>

  <!-- labels -->
  <style>
    .label { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; fill: #c8cdd6; letter-spacing: 0.08em; }
    .label-dim { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; fill: #6b7a94; letter-spacing: 0.05em; }
    .label-sol { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; fill: #e8a735; letter-spacing: 0.1em; }
    .label-target { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; fill: #4fc3c9; letter-spacing: 0.05em; }
    .label-signal { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; fill: #d45c8a; letter-spacing: 0.05em; }
    .label-cone { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; fill: #c47a3a; letter-spacing: 0.05em; }
  </style>

  <!-- SOL label -->
  <text x="130" y="292" text-anchor="middle" class="label-sol" font-size="11" font-weight="600">SOL</text>
  <text x="130" y="306" text-anchor="middle" class="label-dim" font-size="8">YOUR OBSERVATORY</text>

  <!-- aim annotation -->
  <text x="265" y="228" text-anchor="middle" class="label-dim" font-size="8" transform="rotate(-7 265 228)">observatory aims here</text>

  <!-- target label -->
  <text x="420" y="245" text-anchor="middle" class="label-target" font-size="10" font-weight="600">TARGET</text>
  <text x="420" y="258" text-anchor="middle" class="label-dim" font-size="8">[5000, 14000, 100]</text>

  <!-- direction vector label - beside the cone -->
  <text x="495" y="135" class="label-cone" font-size="9" font-weight="500">direction</text>
  <text x="495" y="148" class="label-cone" font-size="9" font-weight="500">[0.4, 0.9, 0.0]</text>
  <!-- pointer line from label to cone centre -->
  <line x1="490" y1="140" x2="445" y2="140" stroke="#c47a3a" stroke-width="0.5" opacity="0.5"/>

  <!-- signal source label -->
  <text x="440" y="28" text-anchor="middle" class="label-signal" font-size="10" font-weight="600">SIGNAL SOURCE</text>
  <text x="440" y="41" text-anchor="middle" class="label-dim" font-size="8">unknown location</text>

  <!-- uncertainty annotation -->
  <text x="365" y="100" text-anchor="end" class="label-dim" font-size="7.5" opacity="0.7">uncertainty cone</text>
  <line x1="368" y1="97" x2="403" y2="80" stroke="#6b7a94" stroke-width="0.5" opacity="0.7"/>
</svg>
