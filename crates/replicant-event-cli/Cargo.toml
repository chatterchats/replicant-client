[package]
name = "replicant-event-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Restart-safe civilisation-event logistics automation for Replicant Space."
license = "MIT"

[[bin]]
name = "replicant-events"
path = "src/main.rs"

[dependencies]
futures = "0.3"
replicant-client = { version = "1.0.0", path = "../..", features = ["managed"] }
replicant-event-planner = { version = "0.1.0", path = "../replicant-event-planner" }
replicant-printing = { version = "0.1.0", path = "../replicant-printing", features = ["managed"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
