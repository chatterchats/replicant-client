[package]
name = "replicant-transport-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Point-to-point resource and device delivery CLI for Replicant Space."
license = "MIT"

[[bin]]
name = "replicant-transport"
path = "src/main.rs"

[dependencies]
replicant-client = { version = "1.0.0", path = "../..", features = ["managed"] }
replicant-transport = { version = "0.1.0", path = "../replicant-transport" }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
