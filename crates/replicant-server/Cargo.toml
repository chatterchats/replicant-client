[package]
name = "replicant-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Local HTTP daemon for the Replicant Space application runtime."
license = "MIT"

[[bin]]
name = "replicantd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
replicant-client = { version = "1.0.0", path = "../.." }
replicant-event-planner = { version = "0.1.0", path = "../replicant-event-planner" }
replicant-protocol = { version = "0.1.0", path = "../replicant-protocol" }
replicant-runtime = { version = "0.1.0", path = "../replicant-runtime" }
replicant-workflow = { version = "0.1.0", path = "../replicant-workflow" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
