[package]
name = "replicant-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Reusable resource and device delivery logistics for Replicant Space."
license = "MIT"

[dependencies]
futures = "0.3"
replicant-client = { version = "1.0.0", path = "../..", features = ["managed"] }
replicant-protocol = { version = "0.1.0", path = "../replicant-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
