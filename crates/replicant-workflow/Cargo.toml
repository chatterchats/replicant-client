[package]
name = "replicant-workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Durable workflow models and persistence for Replicant Space applications."
license = "MIT"

[dependencies]
replicant-client = { version = "1.0.0", path = "../.." }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
wiremock = "0.6"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
