[package]
name = "replicant-rikers-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Local Riker colony-candidate reporting for Replicant Space."
license = "MIT"

[[bin]]
name = "replicant-rikers"
path = "src/main.rs"

[dependencies]
replicant-client = { version = "1.0.0", path = "../..", features = ["managed"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
