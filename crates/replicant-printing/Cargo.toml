[package]
name = "replicant-printing"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Reusable distributed Autofactory scheduling and queueing for Replicant Space."
license = "MIT"

[features]
default = []
managed = ["dep:replicant-client", "dep:serde_json", "dep:tokio", "dep:tracing"]

[dependencies]
replicant-client = { version = "1.0.0", path = "../..", default-features = false, features = ["managed"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
tokio = { version = "1", features = ["time"], optional = true }
tracing = { version = "0.1", optional = true }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
