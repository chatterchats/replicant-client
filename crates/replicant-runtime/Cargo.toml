[package]
name = "replicant-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Application runtime services above the managed Replicant Space client."
license = "MIT"

[dependencies]
futures = "0.3"
replicant-client = { version = "1.0.0", path = "../.." }
replicant-bootstrap-planner = { path = "../replicant-bootstrap-planner" }
replicant-event-planner = { version = "0.1.0", path = "../replicant-event-planner" }
replicant-mining-planner = { version = "0.1.0", path = "../replicant-mining-planner" }
replicant-protocol = { version = "0.1.0", path = "../replicant-protocol" }
replicant-printing = { version = "0.1.0", path = "../replicant-printing", features = ["managed"] }
replicant-route-planner = { version = "0.1.0", path = "../replicant-route-planner" }
replicant-transport = { version = "0.1.0", path = "../replicant-transport" }
replicant-workflow = { version = "0.1.0", path = "../replicant-workflow" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
