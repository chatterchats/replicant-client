[package]
name = "replicant-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Application runtime services above the managed Replicant Space client."
license = "MIT"

[dependencies]
futures = "0.3"
replicant-client = { version = "1.0.0", path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
