[package]
name = "replicant-bootstrap-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[[bin]]
name = "replicant-bootstrap"
path = "src/main.rs"

[dependencies]
futures = "0.3"
replicant-bootstrap-planner = { path = "../replicant-bootstrap-planner" }
replicant-client = { path = "../..", features = ["managed"] }
replicant-mining-cli = { path = "../replicant-mining-cli" }
replicant-mining-planner = { path = "../replicant-mining-planner" }
replicant-printing = { path = "../replicant-printing", features = ["managed"] }
replicant-relay-cli = { path = "../replicant-relay-cli" }
replicant-survey-cli = { path = "../replicant-survey-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
