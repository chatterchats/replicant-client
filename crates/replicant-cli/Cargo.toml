[package]
name = "replicant-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Unified command-line interface for Replicant Space automation."
license = "MIT"

[[bin]]
name = "replicant-cli"
path = "src/main.rs"

[dependencies]
futures = "0.3"
replicant-client = { version = "1.0.0", path = "../..", features = ["managed"] }
replicant-mining-planner = { version = "0.1.0", path = "../replicant-mining-planner" }
replicant-printing = { version = "0.1.0", path = "../replicant-printing", features = ["managed"] }
replicant-route-planner = { version = "0.1.0", path = "../replicant-route-planner" }
replicant-runtime = { version = "0.1.0", path = "../replicant-runtime" }
replicant-transport = { version = "0.1.0", path = "../replicant-transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
