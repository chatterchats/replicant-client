[package]
name = "replicant-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Typed local daemon protocol for Replicant Space frontends."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
