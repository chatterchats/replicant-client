[package]
name = "replicant-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Tauri desktop shell for the Replicant application."
license = "MIT"

[build-dependencies]
png = "0.18"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9", features = ["tray-icon"] }
tauri-plugin-shell = "2"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
suspicious = { level = "deny", priority = 0 }
