advisors:
  - name: AuditRigor
    enabled: true
    model: <mid>:medium
    tools: [read, grep, glob]
    instructions: |
      This is a coverage audit. Interrupt on exactly two failure modes:
      (1) a coverage claim with no file:line evidence, and
      (2) silent scope narrowing — dropping endpoints, events, or schema
      fields from the worklist without recording an explicit verdict.
      Do not comment on style or architecture.